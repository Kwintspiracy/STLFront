<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabletop STL Product Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:wght@300;400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tabletop_theme.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-sans) !important;
            background: var(--background) !important;
            color: var(--foreground) !important;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .product-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            overflow: hidden;
            width: 320px;
            transition: all 300ms ease-out;
            position: relative;
        }
        
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            scale: 1.02;
        }
        
        .product-image-container {
            position: relative;
            width: 100%;
            height: 240px;
            overflow: hidden;
            background: var(--muted);
        }
        
        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 200ms ease-out;
        }
        
        .product-card:hover .product-image {
            transform: scale(1.05);
        }
        
        .favorite-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 200ms ease-out;
            color: var(--muted-foreground);
        }
        
        .favorite-btn:hover {
            background: rgba(255, 255, 255, 1);
            transform: scale(1.1);
        }
        
        .favorite-btn.active {
            color: var(--destructive);
            animation: heartBeat 200ms ease-out;
        }
        
        @keyframes heartBeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        .product-content {
            padding: 1.5rem;
        }
        
        .product-name {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--card-foreground);
            margin-bottom: 0.75rem;
            line-height: 1.4;
        }
        
        .studio-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }
        
        .studio-logo {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border);
            transition: transform 300ms ease-out;
        }
        
        .studio-logo:hover {
            transform: rotate(360deg);
        }
        
        .studio-name {
            font-size: 0.875rem;
            color: var(--muted-foreground);
            font-weight: 500;
        }
        
        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .product-price {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            transition: color 200ms ease-out;
        }
        
        .product-card:hover .product-price {
            color: var(--accent);
        }
        
        .add-to-cart-btn {
            background: var(--primary);
            color: var(--primary-foreground);
            border: none;
            border-radius: var(--radius);
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 200ms ease-out;
            position: relative;
            overflow: hidden;
        }
        
        .add-to-cart-btn:hover {
            background: var(--accent);
            transform: scale(1.05);
        }
        
        .add-to-cart-btn:active {
            transform: scale(0.95);
        }
        
        .add-to-cart-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 400ms ease-out, height 400ms ease-out;
        }
        
        .add-to-cart-btn:active::before {
            width: 300px;
            height: 300px;
        }
        
        .loading-skeleton {
            background: linear-gradient(90deg, var(--muted) 25%, var(--accent) 50%, var(--muted) 75%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }
        
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        
        /* Card appear animation */
        .product-card {
            animation: cardAppear 500ms ease-out;
        }
        
        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="product-card">
        <div class="product-image-container">
            <img 
                src="https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=400&h=300&fit=crop&crop=center" 
                alt="Dragon Miniature STL" 
                class="product-image"
            >
            <button class="favorite-btn" onclick="toggleFavorite(this)">
                <i data-lucide="heart" width="20" height="20"></i>
            </button>
        </div>
        
        <div class="product-content">
            <h3 class="product-name">Ancient Dragon Miniature</h3>
            
            <div class="studio-info">
                <img 
                    src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=64&h=64&fit=crop&crop=face" 
                    alt="MythForge Studio" 
                    class="studio-logo"
                >
                <span class="studio-name">MythForge Studio</span>
            </div>
            
            <div class="product-footer">
                <span class="product-price">$12.99</span>
                <button class="add-to-cart-btn" onclick="addToCart()">
                    <i data-lucide="shopping-cart" width="16" height="16" style="margin-right: 0.5rem;"></i>
                    Add to Cart
                </button>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();
        
        function toggleFavorite(btn) {
            btn.classList.toggle('active');
            const icon = btn.querySelector('[data-lucide="heart"]');
            
            if (btn.classList.contains('active')) {
                icon.setAttribute('data-lucide', 'heart');
                icon.style.fill = 'currentColor';
            } else {
                icon.setAttribute('data-lucide', 'heart');
                icon.style.fill = 'none';
            }
            
            // Re-initialize icons to apply changes
            lucide.createIcons();
        }
        
        function addToCart() {
            const btn = event.target.closest('.add-to-cart-btn');
            
            // Add ripple effect
            btn.style.transform = 'scale(0.95)';
            
            setTimeout(() => {
                btn.style.transform = 'scale(1)';
                
                // Show success feedback
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i data-lucide="check" width="16" height="16" style="margin-right: 0.5rem;"></i>Added!';
                btn.style.background = 'var(--chart-3)';
                
                lucide.createIcons();
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.background = 'var(--primary)';
                    lucide.createIcons();
                }, 2000);
            }, 150);
        }
        
        // Image loading animation
        document.addEventListener('DOMContentLoaded', function() {
            const images = document.querySelectorAll('.product-image, .studio-logo');
            images.forEach(img => {
                img.style.opacity = '0';
                img.style.filter = 'blur(4px)';
                
                img.onload = function() {
                    img.style.transition = 'opacity 400ms ease-out, filter 400ms ease-out';
                    img.style.opacity = '1';
                    img.style.filter = 'blur(0)';
                };
            });
        });
    </script>
</body>
</html>
